[workspace]
resolver = "3"
members = [
    "crates/fastdup-appliance",
    "crates/fastdup-copy-metrics",
    "crates/fastdup-format",
    "crates/fastdup-io-uring",
    "crates/fastdup-posix",
    "crates/fastdup-store",
    "crates/fastdup-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = { version = "1", features = ["rayon"] }
bytes = "1.11.1"
crc32c = "0.6"
fastdup-copy-metrics = { path = "crates/fastdup-copy-metrics" }
fastdup-format = { path = "crates/fastdup-format" }
fastdup-posix = { path = "crates/fastdup-posix" }
fastdup-store = { path = "crates/fastdup-store" }
fastcdc = "4.0.1"
fuse3 = { version = "=0.9.0", features = ["tokio-runtime"] }
futures-util = "0.3.32"
hashbrown = "0.17.1"
libc = "0.2.183"
io-uring = "0.7.10"
lz4 = "1.28.1"
rayon = "1.11.0"
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zstd = { version = "0.13.3", default-features = false, features = ["zdict_builder"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
debug = 1
overflow-checks = true
panic = "abort"

[patch.crates-io]
fuse3 = { path = "vendor/fuse3" }
