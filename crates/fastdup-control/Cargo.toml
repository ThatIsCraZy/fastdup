[package]
name = "fastdup-control"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["json", "macros", "tokio"] }
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
base64 = "0.22.1"
fastdup-appliance = { path = "../fastdup-appliance" }
fastdup-posix.workspace = true
fastdup-store.workspace = true
futures-util.workspace = true
http = "1.3.1"
mime_guess = "2.0.5"
rand = "0.9.2"
rcgen = { version = "0.14.3", features = ["pem", "ring"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls-pemfile = "2.2.0"
x509-parser = "0.18.1"
rust-embed = "8.7.2"
rustix.workspace = true
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.16"
time = { version = "0.3.43", features = ["formatting"] }
tokio.workspace = true
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "compression-gzip", "request-id", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.21.0"

[lints]
workspace = true
